name: whatsapp-studio-bot
runtime: docker
domain: whatsapp-studio-bot.antigravity.app
port: 5005
healthcheck: /health

volume:
  path: /data
  name: studio-data
  size: 2GB

env:
    - USE_PROVIDER=cloud
    - DB_PATH=/data/studio.db
    - PUBLIC_BASE_URL=https://whatsapp-studio-bot.antigravity.app
