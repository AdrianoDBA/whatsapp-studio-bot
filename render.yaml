services:
  - type: web
    name: whatsapp-studio-bot
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: studio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TZ
        value: America/Sao_Paulo
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DB_PATH
        value: /data/studio.db
      - key: AUTH_DIR
        value: /data/auth_session
      - key: VERIFY_TOKEN
        value: botcoromandel123
      - key: USE_PROVIDER
        value: meta
      - key: APP_SECRET
        value: studio_bot_app_secret_2026
      - key: WHATSAPP_APP_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WABA_ID
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
